[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "utility-meter-bot"
version = "0.1.0"
description = "Telegram bot for utility meter readings and billing"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
    "pydantic-settings>=2.7,<3",
    "supabase>=2.11,<3",
]

[project.optional-dependencies]
ocr = [
    "numpy>=1.26,<3",
    "opencv-contrib-python==4.10.0.84",
    "paddleocr==3.7.0",
]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
